<h2>{{ title }}</h2><form method="post" action="{{ request.path }}" class="record-form">{% csrf_token %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<small class="error">{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}</div>{% if object %}<label>Основание корректировки<input name="change_reason" required></label>{% endif %}<footer><button class="button primary" type="submit">Сохранить</button><button class="button dialog-cancel" type="button">Отмена</button></footer></form>
